<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="ts-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="ts-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9838" />
      <stop offset="100%" stop-color="#F27D26" />
    </linearGradient>
    <linearGradient id="ts-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F27D26" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFB366" stop-opacity="0.4" />
    </linearGradient>
    <filter id="ts-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F27D26" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Border -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#ts-grad-bg)" stroke="#27272A" stroke-width="2" />
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="8" y="8" width="104" height="104" rx="24" stroke="url(#ts-glow)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Monogram TS Joined Graphic -->
  <g filter="url(#ts-shadow)">
    <!-- Letter T: Top Bar & Stem -->
    <!-- T Top Bar extending across with angled bevels -->
    <path d="M 24 35 L 70 35 C 72 35 73.5 36.5 73.5 38.5 L 73.5 45.5 C 73.5 47.5 72 49 70 49 L 55 49 L 55 83 C 55 85.5 53 87 50.5 87 L 42.5 87 C 40 87 38 85.5 38 83 L 38 49 L 24 49 C 22 49 20.5 47.5 20.5 45.5 L 20.5 38.5 C 20.5 36.5 22 35 24 35 Z" fill="url(#ts-grad-accent)" />
    
    <!-- Letter S: Interlinked with T, bold futuristic geometry -->
    <path d="M 94 48 L 78 48 C 76.5 48 75.5 46.8 75.8 45.3 C 76.4 42.5 79.2 40.5 83.5 40.5 C 88.5 40.5 93 43 94 45.5 C 94.6 47 96 48 97.8 48 L 99 48 C 99.8 48 100.2 47.2 99.8 46.5 C 97.5 40.5 91.5 35 83.5 35 C 73.5 35 65.5 40.5 65.5 49 C 65.5 58.5 74.5 62 82 64.5 C 89 66.8 91 69 91 73 C 91 77.5 86.5 81 81 81 C 74.5 81 70 77.5 68.5 73 C 68.2 72.2 67.5 71.5 66.5 71.5 L 59.5 71.5 C 58.5 71.5 57.8 72.5 58.2 73.5 C 60.5 82 69 87 81 87 C 93.5 87 102.5 80.5 102.5 71.5 C 102.5 61.5 93 57.5 85.5 55 C 79 52.8 77 50.5 77 47.5 C 77 45 79.5 42.5 83.5 42.5 C 87.5 42.5 90.5 44 91.5 46.5 C 92 47.5 92.8 48 94 48 Z" fill="#FFFFFF" />
  </g>

  <!-- Dynamic Energy Bolt / Speed Spark connecting the two -->
  <path d="M 60 52 L 67 43 L 64 52 L 71 52 L 58 67 L 61 58 L 55 58 Z" fill="#FFC837" opacity="0.9" />
</svg>
