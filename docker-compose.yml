version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: typing-speed-challenge-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=typing_speed_challenge_jwt_secret_2026
    restart: unless-stopped
